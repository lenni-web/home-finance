[project]
name = "ausgaben-archiv"
version = "0.3.2"
description = "Lokales Archiv fuer Kontoauszuege, Rechnungen und Ausgaben"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.2,<5.3",
  "psycopg[binary]>=3.2,<4",
  "Pillow>=11,<12",
  "pypdf>=5,<6",
  "celery[redis]>=5.5,<6",
  "gunicorn>=23,<24",
  "whitenoise>=6.8,<7",
  "cryptography>=45,<47",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "ledger*"]

[tool.ruff]
line-length = 100
