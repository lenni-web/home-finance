<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmeldung · Ausgabenarchiv</title>
  <style>
    :root { font-family:system-ui,sans-serif; color:#1f2937; background:#f8fafc; }
    body { min-height:100vh; display:grid; place-items:center; margin:0; padding:1rem; }
    main { width:min(420px,100%); background:white; border:1px solid #e2e8f0; border-radius:16px; padding:1.5rem; box-sizing:border-box; }
    label { display:block; font-weight:650; margin-top:.8rem; } input { width:100%; box-sizing:border-box; padding:.65rem; }
    button { width:100%; margin-top:1rem; border:0; border-radius:8px; padding:.75rem; background:#0f766e; color:white; cursor:pointer; }
    .errorlist { color:#b91c1c; }
  </style>
</head>
<body><main><h1>Ausgabenarchiv</h1><p>Bitte anmelden, um Finanzdaten und Dokumente aufzurufen.</p><form method="post">{% csrf_token %}{{ form.as_p }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button>Anmelden</button></form></main></body>
</html>
