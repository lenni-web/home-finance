name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ausgaben
          POSTGRES_USER: ausgaben
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ausgaben -d ausgaben"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-secret
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ci-only
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_TASK_ALWAYS_EAGER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu ocrmypdf
      - run: pip install -r requirements.lock
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit && pip-audit -r requirements.lock
